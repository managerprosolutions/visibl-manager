<!doctype html>
<html lang="fr">
<head>
    <script id="visibl-session-early">
        (() => {
            try {
                const session = JSON.parse(localStorage.getItem("visibl_user"));
                if (typeof session?.sessionToken === "string" && session.sessionToken.trim() &&
                    typeof session.roleId === "string" && session.roleId.trim()) return;
            } catch {}
            location.replace("connexion.html");
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=param%C3%A8tres.html">
    <title>VISIBL</title>
</head>
<body>
    <main><a href="param%C3%A8tres.html">Ouvrir les paramètres</a></main>
</body>
</html>
