<!DOCTYPE html>
<html lang="fr" data-visibl-session-locked>
<head>
    <script id="visibl-session-early">
        (() => {
            try {
                const session = JSON.parse(localStorage.getItem("visibl_user"));
                if (typeof session?.sessionToken === "string" && session.sessionToken.trim() &&
                    typeof session.roleId === "string" && session.roleId.trim()) return;
            } catch {}
            location.replace("connexion.html");
        })();
    </script>
    <script id="visibl-session-fallback">
        (() => {
            const recuperer = () => {
                if (document.documentElement.hasAttribute("data-visibl-session-started")) return;
                const status = document.getElementById("visibl-session-status");
                if (!status || status.getAttribute("aria-busy") === "false") return;
                document.getElementById("visibl-session-message").textContent = "Vérification indisponible. Réessayez.";
                const retry = document.getElementById("visibl-session-retry");
                retry.hidden = false;
                retry.addEventListener("click", () => location.reload(), { once: true });
                status.setAttribute("aria-busy", "false");
            };
            document.addEventListener("DOMContentLoaded", recuperer, { once: true });
            window.setTimeout(recuperer, 12000);
        })();
    </script>



<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factures</title>
<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/factures.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="../css/visibl-loading.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/visibl-ui.css">
    <link rel="stylesheet" href="../css/visibl-clients-layout.css">

    <link rel="stylesheet" href="../css/visibl-session.css">
    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/visibl-loading.js" defer></script>
    <script src="../js/visibl-session-page.js" defer></script>
</head>
<body>
<section id="visibl-session-status" aria-label="Chargement" aria-busy="true">
    <p id="visibl-session-message" role="status"></p>
    <button type="button" id="visibl-session-retry" hidden>Réessayer</button>
</section>
<template id="visibl-private-content">
<div class="container">
<div data-visibl-sidebar-slot></div>

<main class="main-content">
<div data-visibl-header-slot data-title="Factures" data-search="Rechercher une facture..." data-search-id="invoice-header-search" data-search-button="invoice-header-search-btn"></div>

<section class="content">
<div class="welcome-section"><div><h2>Facturation clients</h2><p>Consultez les factures générées automatiquement depuis les ventes et les factures d’avoir issues des retours clients.</p></div></div>

<div class="kpi-grid invoices-kpi-grid">
<article class="kpi-card"><div class="kpi-card-header"><span class="kpi-icon">🧾</span><span class="kpi-title">Factures émises</span></div><h3 class="kpi-value" id="total-invoices-value">0</h3><p class="kpi-description">Factures clients</p></article>
<article class="kpi-card"><div class="kpi-card-header"><span class="kpi-icon">💰</span><span class="kpi-title">Montant facturé</span></div><h3 class="kpi-value" id="invoiced-amount-value">0 FCFA</h3><p class="kpi-description">Total TTC</p></article>
<article class="kpi-card"><div class="kpi-card-header"><span class="kpi-icon">✅</span><span class="kpi-title">Montant encaissé</span></div><h3 class="kpi-value" id="invoice-paid-value">0 FCFA</h3><p class="kpi-description">Paiements des clients</p></article>
<article class="kpi-card"><div class="kpi-card-header"><span class="kpi-icon">⏳</span><span class="kpi-title">Reste à encaisser</span></div><h3 class="kpi-value" id="invoice-balance-value">0 FCFA</h3><p class="kpi-description">Créances restantes</p></article>
<article class="kpi-card"><div class="kpi-card-header"><span class="kpi-icon">↩️</span><span class="kpi-title">Avoirs</span></div><h3 class="kpi-value" id="credit-notes-value">0</h3><p class="kpi-description" id="credit-notes-description">0 FCFA en avoirs</p></article>
</div>

<div class="invoices-toolbar"><div class="toolbar-left">
<button class="btn-secondary" id="export-invoices-btn" type="button">📤 Exporter</button>
<button class="btn-secondary" id="print-invoices-btn" type="button">🖨️ Imprimer</button>
<button class="btn-secondary" id="refresh-invoices-btn" type="button">🔄 Actualiser</button>
</div><div class="toolbar-right"><span class="invoice-count"><strong id="filtered-invoice-count">0</strong> facture(s) affichée(s)</span></div></div>

<div class="invoice-quick-filters" id="invoice-quick-filters">
<button type="button" class="invoice-quick-filter active" data-invoice-quick="">Toutes</button>
<button type="button" class="invoice-quick-filter" data-invoice-quick="impayee">Impayées</button>
<button type="button" class="invoice-quick-filter" data-invoice-quick="partiellement-payee">Partiellement payées</button>
<button type="button" class="invoice-quick-filter" data-invoice-quick="payee">Payées</button>
<button type="button" class="invoice-quick-filter" data-invoice-quick="avoir">Avoirs</button>
</div><div class="invoices-filters">
<div class="invoices-search"><span class="search-icon">🔍</span><input type="text" id="invoices-search-input" placeholder="Numéro, client, vente, facture origine..."></div>
<select id="invoice-type-filter"><option value="">Tous les types</option><option value="facture">Facture</option><option value="avoir">Avoir</option></select>
<select id="invoice-status-filter"><option value="">Tous les statuts</option><option value="emise">Émise</option><option value="partiellement-payee">Partiellement payée</option><option value="payee">Payée</option><option value="annule">Annulée</option></select>
<button class="btn-filter-reset" id="reset-invoice-filters" type="button">Effacer les filtres</button>
</div>

<div class="invoices-table-container"><div class="table-responsive">
<table class="invoices-table"><thead><tr><th>N° Facture</th><th>Date</th><th>Type</th><th>Client</th><th>Vente</th><th>Articles</th><th>Montant TTC</th><th>Payé</th><th>Reste</th><th>Statut</th><th>Actions</th></tr></thead>
<tbody id="invoices-table-body"><tr><td colspan="11" class="empty-table">Aucune facture enregistrée.</td></tr></tbody></table>
</div>
<div class="table-pagination"><div class="pagination-info"><span>Afficher</span><select id="invoices-per-page"><option>10</option><option>25</option><option>50</option><option>100</option></select><span>éléments par page</span></div>
<div class="pagination-controls"><button class="pagination-btn" id="previous-invoice-page-btn" type="button">‹</button><span id="invoices-page-buttons" class="pagination-controls"></span><span id="invoices-pagination-summary" class="pagination-summary"></span><button class="pagination-btn" id="next-invoice-page-btn" type="button">›</button></div></div>
</div>
</section>
</main>
</div>

<div class="modal-overlay" id="invoice-modal" aria-hidden="true">
<div class="modal invoice-modal" role="dialog" aria-modal="true" aria-labelledby="invoice-modal-title">
<div class="modal-header"><div><h2 id="invoice-modal-title">Facture</h2><p id="invoice-modal-subtitle">Document client</p></div><button type="button" class="modal-close" id="close-invoice-modal">✕</button></div>
<div class="modal-body">
<article class="invoice-document" id="invoice-document">
<div class="invoice-document-header"><div class="invoice-brand"><img src="../logo-vizibl.png" alt="VISIBL"><div><strong>VISIBL</strong><span>Document commercial</span></div></div><div class="invoice-document-title"><span id="invoice-document-type">FACTURE</span><strong id="invoice-document-number">—</strong></div></div>
<div class="invoice-parties"><div class="invoice-box"><span class="invoice-label">Client</span><strong id="invoice-client-name">—</strong><small id="invoice-client-contact">—</small></div><div class="invoice-box"><span class="invoice-label">Informations</span><div><strong>Date :</strong> <span id="invoice-date">—</span></div><div><strong>Vente :</strong> <span id="invoice-sale-id">—</span></div><div id="invoice-origin-row" hidden><strong>Facture origine :</strong> <span id="invoice-origin-number">—</span></div></div></div>
<div class="invoice-credit-reason" id="invoice-credit-reason" hidden><strong>Motif de l’avoir :</strong> <span id="invoice-credit-reason-text"></span></div>
<div class="invoice-lines-wrapper"><table class="invoice-lines-table"><thead><tr><th>Produit</th><th>Qté</th><th>Prix unitaire TTC</th><th>Remise</th><th>Sous-total TTC</th></tr></thead><tbody id="invoice-lines-body"></tbody></table></div>
<div class="invoice-summary"><div class="invoice-note"><span class="invoice-label">Statut</span><strong id="invoice-status-display">—</strong></div><div class="invoice-totals"><div><span>Montant TTC</span><strong id="invoice-total-display">0 FCFA</strong></div><div id="invoice-paid-row"><span>Paiement encaissé</span><strong id="invoice-paid-display">0 FCFA</strong></div><div id="invoice-credit-used-row" hidden style="display:none;"><span>Avoir client utilisé</span><strong id="invoice-credit-used-display">0 FCFA</strong></div><div id="invoice-settled-row"><span>Total réglé</span><strong id="invoice-settled-display">0 FCFA</strong></div><div id="invoice-balance-row"><span>Reste à payer</span><strong id="invoice-balance-display">0 FCFA</strong></div></div></div>
<div class="invoice-trace-section"><div class="invoice-trace-heading"><div><span class="invoice-label">Traçabilité</span><h3>Historique de la facture</h3></div><span class="invoice-trace-count" id="invoice-history-count">0 événement</span></div><div class="invoice-history" id="invoice-history"><div class="invoice-history-loading">Chargement de l’historique…</div></div></div><div class="invoice-comment" id="invoice-comment-box" hidden><span class="invoice-label">Commentaire</span><p id="invoice-comment-text"></p></div>
</article>
</div>
<div class="modal-footer"><button class="btn-secondary" id="copy-invoice-number-btn" type="button">📋 Copier le numéro</button><button class="btn-secondary" id="open-invoice-sale-btn" type="button">🔗 Voir la vente</button><button class="btn-secondary" id="open-invoice-payments-btn" type="button" hidden>💳 Voir le paiement</button><button class="btn-secondary" id="open-invoice-return-btn" type="button" hidden>↩️ Voir le retour</button><button class="btn-secondary" id="print-current-invoice-btn" type="button">🖨️ Imprimer / PDF</button><button class="btn-primary" id="close-invoice-footer-btn" type="button">Fermer</button></div>
</div>
</div>
<div class="modal-overlay" id="invoice-sale-modal" aria-hidden="true">
  <div class="modal invoice-sale-modal" role="dialog" aria-modal="true" aria-labelledby="invoice-linked-sale-title">
    <div class="modal-header">
      <div class="invoice-sale-modal-heading"><span class="invoice-sale-modal-kicker">VENTE LIÉE</span><h2 id="invoice-linked-sale-title">Voir la vente</h2><p id="invoice-sale-subtitle">Vente liée à la facture</p></div>
      <button type="button" class="modal-close" id="close-invoice-sale-modal">✕</button>
    </div>
    <div class="modal-body">
      <div class="invoice-sale-view">
        <div class="invoice-sale-hero">
          <div><span class="invoice-sale-label">Vente</span><strong id="invoice-linked-sale-id">—</strong></div>
          <span class="invoice-status-badge" id="invoice-sale-status">—</span>
        </div>
        <div class="invoice-sale-grid">
          <article class="invoice-sale-card"><span class="invoice-sale-label">Client</span><strong id="invoice-sale-client">—</strong><small id="invoice-sale-client-contact">—</small></article>
          <article class="invoice-sale-card"><span class="invoice-sale-label">Date</span><strong id="invoice-sale-date">—</strong><small id="invoice-sale-order">—</small></article>
        </div>
        <article class="invoice-sale-card">
          <span class="invoice-sale-label">Produits vendus</span>
          <div class="invoice-sale-lines-wrapper">
            <table class="invoice-sale-lines"><thead><tr><th>Produit</th><th>Qté</th><th>Prix unitaire</th><th>Sous-total</th></tr></thead><tbody id="invoice-sale-lines-body"></tbody></table>
          </div>
        </article>
        <article class="invoice-sale-card">
          <span class="invoice-sale-label">Situation financière</span>
          <div class="invoice-sale-finance">
            <div><span>Montant TTC</span><strong id="invoice-sale-total">0 FCFA</strong></div>
            <div><span>Paiement encaissé</span><strong id="invoice-sale-paid">0 FCFA</strong></div>
            <div id="invoice-sale-credit-row" hidden><span>Avoir client utilisé</span><strong id="invoice-sale-credit">0 FCFA</strong></div>
            <div><span>Total réglé</span><strong id="invoice-sale-settled">0 FCFA</strong></div>
            <div><span>Reste à payer</span><strong id="invoice-sale-balance">0 FCFA</strong></div>
          </div>
        </article>
      </div>
    </div>
    <div class="modal-footer"><button class="btn-primary" id="close-invoice-sale-footer-btn" type="button">Fermer</button></div>
  </div>
</div>
<div class="modal-overlay" id="invoice-payments-modal" aria-hidden="true"><div class="modal invoice-mini-modal" role="dialog" aria-modal="true" aria-labelledby="invoice-payment-title"><div class="modal-header"><div><span class="invoice-modal-kicker">RÈGLEMENTS</span><h2 id="invoice-payment-title">Paiements de la facture</h2><p id="invoice-payments-subtitle">—</p></div><button type="button" class="modal-close" id="close-invoice-payments-modal">✕</button></div><div class="modal-body"><div class="invoice-payment-summary"><div><span>Total encaissé</span><strong id="invoice-payments-total">0 FCFA</strong></div><div><span>Nombre de paiements</span><strong id="invoice-payments-count">0</strong></div></div><div id="invoice-payments-list" class="invoice-payments-list"></div></div><div class="modal-footer"><button class="btn-primary" id="close-invoice-payments-footer-btn" type="button">Fermer</button></div></div></div>
<div class="modal-overlay" id="invoice-return-modal" aria-hidden="true"><div class="modal invoice-mini-modal" role="dialog" aria-modal="true" aria-labelledby="invoice-return-title"><div class="modal-header"><div><span class="invoice-modal-kicker">RETOUR CLIENT</span><h2 id="invoice-return-title">Détail du retour</h2><p id="invoice-return-subtitle">Origine de la facture d’avoir</p></div><button type="button" class="modal-close" id="close-invoice-return-modal">✕</button></div><div class="modal-body"><div class="invoice-return-hero"><div><span>Retour</span><strong id="invoice-return-id">—</strong></div><span id="invoice-return-status" class="invoice-status-badge">—</span></div><div class="invoice-return-grid"><article><span>Date du retour</span><strong id="invoice-return-date">—</strong></article><article><span>Vente concernée</span><strong id="invoice-return-sale">—</strong></article></div><article class="invoice-return-reason"><span>Motif</span><p id="invoice-return-reason-text">—</p></article><div class="invoice-return-lines-wrapper"><table class="invoice-return-lines"><thead><tr><th>Produit</th><th>Qté</th><th>Montant</th></tr></thead><tbody id="invoice-return-lines-body"></tbody></table></div></div><div class="modal-footer"><button class="btn-primary" id="close-invoice-return-footer-btn" type="button">Fermer</button></div></div></div><div id="toast-container"></div>
<script src="../js/visibl-clients-layout.js"></script>
<script src="../js/app.js"></script>
<script src="../js/modules/notifications.js"></script>
<script src="../js/header.js"></script>
<script src="../js/modules/factures.js"></script>
<script src="../js/visibl-ui.js" defer></script>
</template>
</body></html>
