<!DOCTYPE html>

<html lang="fr" data-visibl-session-locked>

<head>
    <script id="visibl-session-early">
        (() => {
            try {
                const session = JSON.parse(localStorage.getItem("visibl_user"));
                if (typeof session?.sessionToken === "string" && session.sessionToken.trim() &&
                    typeof session.roleId === "string" && session.roleId.trim()) return;
            } catch {}
            location.replace("connexion.html");
        })();
    </script>
    <script id="visibl-session-fallback">
        (() => {
            const recuperer = () => {
                if (document.documentElement.hasAttribute("data-visibl-session-started")) return;
                const status = document.getElementById("visibl-session-status");
                if (!status || status.getAttribute("aria-busy") === "false") return;
                document.getElementById("visibl-session-message").textContent = "Vérification indisponible. Réessayez.";
                const retry = document.getElementById("visibl-session-retry");
                retry.hidden = false;
                retry.addEventListener("click", () => location.reload(), { once: true });
                status.setAttribute("aria-busy", "false");
            };
            document.addEventListener("DOMContentLoaded", recuperer, { once: true });
            window.setTimeout(recuperer, 12000);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tableau de bord</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">

    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/visibl-ui.css">
    <link rel="stylesheet" href="../css/visibl-clients-layout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" media="print" onload="this.media='all'">

    <link rel="stylesheet" href="../css/visibl-session.css">
    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/visibl-session-page.js" defer></script>
</head>

<body>
<section id="visibl-session-status" aria-label="Chargement" aria-busy="true">
    <p id="visibl-session-message" role="status"></p>
    <button type="button" id="visibl-session-retry" hidden>Réessayer</button>
</section>
<div id="dashboard-loader" data-visibl-public-loader class="dashboard-loader is-hidden" role="status" aria-live="polite" aria-busy="false">
    <div class="dashboard-loader-backdrop"></div>

    <div class="dashboard-loader-card">
        <div class="dashboard-loader-visual" aria-hidden="true">
            <div class="dashboard-loader-ring">
                <div class="dashboard-loader-bars">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
            <span class="dashboard-loader-spark spark-1">✦</span>
            <span class="dashboard-loader-spark spark-2">＋</span>
            <span class="dashboard-loader-spark spark-3">◇</span>
            <span class="dashboard-loader-spark spark-4">✦</span>
        </div>

        <h2>Mise à jour du tableau de bord...</h2>
        <p>Récupération et calcul des données en cours</p>

        <div class="dashboard-loader-progress-wrap">
            <div class="dashboard-loader-progress" aria-hidden="true">
                <span id="dashboard-loader-progress-bar"></span>
            </div>
            <strong id="dashboard-loader-progress-text">8%</strong>
        </div>

        <div class="dashboard-loader-hint">
            <span aria-hidden="true">◷</span>
            <span>Cela peut prendre quelques secondes</span>
        </div>
    </div>
</div>
<template id="visibl-private-content">

<div class="container">

    <!-- ========================================
         SIDEBAR
    ======================================== -->

    <div data-visibl-sidebar-slot></div>

    <!-- ========================================
         CONTENU PRINCIPAL
    ======================================== -->

    <main class="main-content">

        <!-- ========================================
             HEADER
        ======================================== -->

        <div data-visibl-header-slot data-title="Tableau de bord"></div>

        <!-- ========================================
             CONTENU DU DASHBOARD
        ======================================== -->

        <section class="content">

            <div class="welcome-section">
<h2>
    Bienvenue,
    <span id="user-name">Utilisateur</span>
</h2>

<p>
    <span id="user-role">Rôle utilisateur</span>
    — Tableau de bord VISIBL
</p>

</div>

            <!-- ========================================
                 KPI PRINCIPAUX
            ======================================== -->

            <div class="dashboard-grid">

                <div class="card">

                    <div class="card-icon income">
                        💰
                    </div>

                    <div class="card-content">
                        <h3>Revenus</h3>

                        <div class="card-value" id="revenus-value">
                            0 FCFA
                        </div>

                        <span class="card-trend up" id="revenus-trend"></span>
                    </div>

                </div>

                <div class="card">

                    <div class="card-icon orders">
                        📦
                    </div>

                    <div class="card-content">
                        <h3>Commandes</h3>

                        <div class="card-value" id="commandes-value">
                            0
                        </div>

                        <span class="card-trend up" id="commandes-trend"></span>
                    </div>

                </div>

                <div class="card">

                    <div class="card-icon products">
                        🛍️
                    </div>

                    <div class="card-content">
                        <h3>Produits</h3>

                        <div class="card-value" id="produits-value">
                            0
                        </div>

                        <span class="card-trend up" id="produits-trend"></span>
                    </div>

                </div>

                <div class="card">

                    <div class="card-icon clients">
                        👥
                    </div>

                    <div class="card-content">
                        <h3>Clients</h3>

                        <div class="card-value" id="clients-value">
                            0
                        </div>

                        <span class="card-trend down" id="clients-trend"></span>
                    </div>

                </div>

            </div>

            <!-- ========================================
                 KPI SECONDAIRES
            ======================================== -->

            <div class="recent-statistics">

                <h3>Statistiques récentes</h3>

                <p class="statistics-description">
                    Voici un aperçu des performances de votre entreprise
                    au cours de la dernière période.
                </p>

                <div class="dashboard-grid">

                    <div class="card">

                        <div class="card-icon income">
                            📊
                        </div>

                        <div class="card-content">
                            <h3>Taux de conversion</h3>

                            <div class="card-value" id="conversion-value">
                                0%
                            </div>

                            <span
                                class="card-trend up"
                                id="conversion-trend">
                            </span>
                        </div>

                    </div>

                    <div class="card">

                        <div class="card-icon orders">
                            🚚
                        </div>

                        <div class="card-content">
                            <h3>Livraisons</h3>

                            <div class="card-value" id="livraisons-value">
                                0
                            </div>

                            <span
                                class="card-trend up"
                                id="livraisons-trend">
                            </span>
                        </div>

                    </div>

                    <div class="card">

                        <div class="card-icon products">
                            💳
                        </div>

                        <div class="card-content">
                            <h3>Paiements</h3>

                            <div class="card-value" id="paiements-value">
                                0 FCFA
                            </div>

                            <span
                                class="card-trend up"
                                id="paiements-trend">
                            </span>
                        </div>

                    </div>

                    <div class="card">

                        <div class="card-icon clients">
                            📋
                        </div>

                        <div class="card-content">
                            <h3>Factures</h3>

                            <div class="card-value" id="factures-value">
                                0
                            </div>

                            <span
                                class="card-trend up"
                                id="factures-trend">
                            </span>
                        </div>

                    </div>

                </div>

            </div>

            <!-- ========================================
                 GRAPHIQUES DU DASHBOARD
            ======================================== -->

            <section class="dashboard-charts">

                <!-- Graphique des revenus -->

                <div class="chart-card chart-card-large">

                    <div class="chart-header">

                        <div>
                            <h2>Évolution des revenus</h2>
                            <p>Revenus des six derniers mois</p>
                        </div>

                        <select id="periode-revenus">
                            <option value="6">
                                6 derniers mois
                            </option>

                            <option value="12">
                                12 derniers mois
                            </option>
                        </select>

                    </div>

                    <div class="chart-container">
                        <canvas id="revenus-chart" role="img" aria-label="Évolution des revenus nets"></canvas>
                    </div>

                </div>

                <!-- Graphique de répartition des ventes -->

                <div class="chart-card chart-card-small">

                    <div class="chart-header">

                        <div>
                            <h2>Répartition des ventes</h2>
                            <p>Ventes par catégorie</p>
                        </div>

                    </div>

                    <div class="chart-container">
                        <canvas id="ventes-chart" role="img" aria-label="Répartition des ventes"></canvas>
                    </div>

                </div>

            </section>

        <section class="dashboard-alerts" aria-label="Alertes du tableau de bord" id="dashboard-alerts"></section>
        </section>

    </main>

</div>

<!-- ========================================
     ÉTAT DE CHARGEMENT DU DASHBOARD
======================================== -->
<div id="dashboard-load-status" class="visibl-feedback" role="status" hidden>
    <span>Le tableau de bord n’a pas pu être actualisé.</span>
    <button id="retry-dashboard-btn" type="button" class="btn-secondary">Réessayer</button>
</div>

<!-- ========================================
     SCRIPTS
======================================== -->





<script src="../js/visibl-clients-layout.js"></script>
<script src="../js/app.js"></script>

<script data-visibl-optional src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>

<script src="../js/modules/notifications.js"></script>
<script src="../js/header.js"></script>

<script src="../js/dashboard.js"></script>

<script src="../js/visibl-ui.js" defer></script>
</template>
</body>
</html>
