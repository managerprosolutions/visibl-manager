<!DOCTYPE html>
<html lang="fr" data-visibl-session-locked>

<head>
    <script id="visibl-session-early">
        (() => {
            try {
                const session = JSON.parse(localStorage.getItem("visibl_user"));
                if (typeof session?.sessionToken === "string" && session.sessionToken.trim() &&
                    typeof session.roleId === "string" && session.roleId.trim()) return;
            } catch {}
            location.replace("connexion.html");
        })();
    </script>
    <script id="visibl-session-fallback">
        (() => {
            const recuperer = () => {
                if (document.documentElement.hasAttribute("data-visibl-session-started")) return;
                const status = document.getElementById("visibl-session-status");
                if (!status || status.getAttribute("aria-busy") === "false") return;
                document.getElementById("visibl-session-message").textContent = "Vérification indisponible. Réessayez.";
                const retry = document.getElementById("visibl-session-retry");
                retry.hidden = false;
                retry.addEventListener("click", () => location.reload(), { once: true });
                status.setAttribute("aria-busy", "false");
            };
            document.addEventListener("DOMContentLoaded", recuperer, { once: true });
            window.setTimeout(recuperer, 12000);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paramètres</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/visibl-session.css">
    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/visibl-loading.js" defer></script>
    <script src="../js/visibl-session-page.js" defer></script>
</head>

</section>

                                    <label class="settings-switch-row"><div><strong>Stock faible</strong><span>Alerte lorsqu'un produit passe sous son seuil minimum.</span></div><input id="notification-low-stock" type="checkbox" class="settings-switch-input"><span class="settings-switch"></span></label>
                                    <label class="settings-switch-row"><div><strong>Rupture de stock</strong><span>Alerte lorsqu'un produit atteint zéro unité vendable.</span></div><input id="notification-out-stock" type="checkbox" class="settings-switch-input"><span class="settings-switch"></span></label>
                                    <label class="settings-switch-row"><div><strong>Retard de livraison</strong><span>Alerte lorsqu'une livraison dépasse sa date prévue sans être clôturée.</span></div><input id="notification-delivery-late" type="checkbox" class="settings-switch-input"><span class="settings-switch"></span></label>
                                    <label class="settings-switch-row"><div><strong>Livraison à préparer</strong><span>Alerte lorsqu'une nouvelle livraison entre dans la file de préparation.</span></div><input id="notification-delivery-to-prepare" type="checkbox" class="settings-switch-input"><span class="settings-switch"></span></label>
                                    <label class="settings-switch-row"><div><strong>Livraison prête pour départ</strong><span>Alerte lorsque la préparation est validée et que le colis est prêt.</span></div><input id="notification-delivery-ready" type="checkbox" class="settings-switch-input"><span class="settings-switch"></span></label>
                                    <label class="settings-switch-row"><div><strong>En livraison</strong><span>Alerte lorsque le départ du livreur est confirmé.</span></div><input id="notification-delivery-in-progress" type="checkbox" class="settings-switch-input"><span class="settings-switch"></span></label>
                                    <label class="settings-switch-row"><div><strong>Livraison clôturée — Livrée</strong><span>Alerte lorsqu'une livraison est clôturée avec le résultat Livrée.</span></div><input id="notification-delivery-done" type="checkbox" class="settings-switch-input"><span class="settings-switch"></span></label>
                                    <label class="settings-switch-row"><div><strong>Livraison clôturée — Non livrée</strong><span>Alerte lorsqu'une livraison est clôturée après un échec définitif.</span></div><input id="notification-delivery-not-delivered" type="checkbox" class="settings-switch-input"><span class="settings-switch"></span></label>
                                    <label class="settings-switch-row"><div><strong>Livraison reportée</strong><span>Alerte lorsqu'une livraison est reprogrammée pour une nouvelle tentative.</span></div><input id="notification-delivery-postponed" type="checkbox" class="settings-switch-input"><span class="settings-switch"></span></label>
                                    <label class="settings-switch-row"><div><strong>Retour produit</strong><span>Alerte après l'enregistrement d'un retour de vente.</span></div><input id="notification-product-return" type="checkbox" class="settings-switch-input"><span class="settings-switch"></span></label>
                                    <label class="settings-switch-row"><div><strong>Mouvement de caisse important</strong><span>Alerte pour toute entrée ou sortie atteignant le seuil défini ci-dessous.</span></div><input id="notification-cash-important" type="checkbox" class="settings-switch-input"><span class="settings-switch"></span></label>
                                    <label class="settings-switch-row"><div><strong>Solde de caisse faible</strong><span>Alerte lorsqu'un compte financier franchit son seuil minimum.</span></div><input id="notification-cash-low" type="checkbox" class="settings-switch-input"><span class="settings-switch"></span></label>
                                </div>
                            </div>

                            <div class="notification-settings-card">
                                <div class="notification-settings-card-header">
                                    <div>
                                        <h4>Seuils de caisse</h4>
                                        <p>Les seuils de solde suivent automatiquement les comptes financiers configurés dans Finance.</p>
                                    </div>
                                </div>

                                <div class="settings-form-grid">
                                    <div class="settings-field">
                                        <label for="notification-important-cash-threshold">Mouvement important à partir de</label>
                                        <div class="settings-money-input"><input id="notification-important-cash-threshold" type="number" min="0" step="1"><span>FCFA</span></div>
                                    </div>
                                </div>

                                <div class="notification-account-thresholds" id="notification-account-thresholds">
                                    <p class="notification-threshold-loading">Chargement des comptes financiers...</p>
                                </div>
                            </div>

                            <div class="notification-settings-card">
                                <div class="notification-settings-card-header">
                                    <div>
                                        <h4>Rapports automatiques</h4>
                                        <p>Ces résumés globaux sont réservés à l'administrateur.</p>
                                    </div>
                                </div>

                                <div class="settings-options-list notification-options-grid">
                                    <label class="settings-switch-row"><div><strong>Rapport journalier</strong><span>Résumé automatique de l'activité de la journée.</span></div><input id="notification-daily-report" type="checkbox" class="settings-switch-input"><span class="settings-switch"></span></label>
                                    <label class="settings-switch-row"><div><strong>Rapport hebdomadaire</strong><span>Résumé automatique de l'activité de la semaine.</span></div><input id="notification-weekly-report" type="checkbox" class="settings-switch-input"><span class="settings-switch"></span></label>
                                    <label class="settings-switch-row"><div><strong>Rapport mensuel</strong><span>Résumé automatique de l'activité du mois.</span></div><input id="notification-monthly-report" type="checkbox" class="settings-switch-input"><span class="settings-switch"></span></label>
                                </div>
                            </div>

                            <div id="notifications-settings-message" class="settings-form-message" hidden></div>

                            <div class="settings-form-actions">
                                <button type="button" class="btn-secondary" id="disable-all-notifications-btn">Tout désactiver</button>
                                <button type="button" class="btn-secondary" id="reset-notifications-settings-btn">Annuler les modifications</button>
                                <button type="submit" class="btn-primary" id="save-notifications-settings-btn">💾 Enregistrer</button>
                            </div>
                        </form>
                    </div>

                    <!-- =====================================================
                         SÉCURITÉ
                    ====================================================== -->
                    <div
                        class="settings-section"
                        id="security-settings"
                    >

                        <div class="settings-section-header">

                            <div>

                                <h3>
                                    Sécurité du compte
                                </h3>

                                <p>
                                    Modifiez votre mot de passe et contrôlez les paramètres
                                    de sécurité du système.
                                </p>

                            </div>

                            <div class="settings-section-icon">
                                🛡️
                            </div>

                        </div>

                        <form class="settings-form">

                            <h4 class="settings-form-title">
                                Modifier le mot de passe
                            </h4>

                            <div class="settings-form-grid">

                                <div class="form-group">

                                    <label for="current-password">
                                        Mot de passe actuel
                                    </label>

                                    <input
                                        type="password"
                                        id="current-password"
                                        placeholder="Saisissez votre mot de passe actuel"
                                    >

                                </div>

                                <div></div>

                                <div class="form-group">

                                    <label for="new-password">
                                        Nouveau mot de passe
                                    </label>

                                    <input
                                        type="password"
                                        id="new-password"
                                        placeholder="Saisissez le nouveau mot de passe"
                                    >

                                </div>

                                <div class="form-group">

                                    <label for="confirm-password">
                                        Confirmer le mot de passe
                                    </label>

                                    <input
                                        type="password"
                                        id="confirm-password"
                                        placeholder="Confirmez le nouveau mot de passe"
                                    >

                                </div>

                            </div>

                            <div class="password-requirements">

                                <h4>
                                    Le mot de passe doit contenir :
                                </h4>

                                <ul>
                                    <li>Au moins 8 caractères</li>
                                    <li>Une lettre majuscule</li>
                                    <li>Une lettre minuscule</li>
                                    <li>Un chiffre</li>
                                    <li>Un caractère spécial</li>
                                </ul>

                            </div>

                            <div class="settings-form-actions">

                                <button
                                    type="reset"
                                    class="btn-secondary"
                                >
                                    Annuler
                                </button>

                                <button
                                    type="submit"
                                    class="btn-primary"
                                >
                                    🔐 Modifier le mot de passe
                                </button>

                            </div>

                        </form>

                        <div class="security-settings-block">

                            <h4>
                                Options de sécurité
                            </h4>

                            <div class="settings-options-list">

                                <label class="settings-switch-row">

                                    <div>

                                        <strong>
                                            Authentification à deux facteurs
                                        </strong>

                                        <span>
                                            Ajouter une étape de vérification lors de la connexion.
                                        </span>

                                    </div>

                                    <input
                                        type="checkbox"
                                        class="settings-switch-input"
                                    >

                                    <span class="settings-switch"></span>

                                </label>

                                <label class="settings-switch-row">

                                    <div>

                                        <strong>
                                            Déconnexion automatique
                                        </strong>

                                        <span>
                                            Déconnecter l'utilisateur après une période d'inactivité.
                                        </span>

                                    </div>

                                    <input
                                        type="checkbox"
                                        class="settings-switch-input"
                                        checked
                                    >

                                    <span class="settings-switch"></span>

                                </label>

                                <div class="settings-inline-option">

                                    <div>

                                        <strong>
                                            Durée avant déconnexion
                                        </strong>

                                        <span>
                                            Temps maximum d'inactivité autorisé.
                                        </span>

                                    </div>

                                    <select id="session-timeout">

                                        <option value="15">
                                            15 minutes
                                        </option>

                                        <option value="30" selected>
                                            30 minutes
                                        </option>

                                        <option value="60">
                                            1 heure
                                        </option>

                                        <option value="120">
                                            2 heures
                                        </option>

                                    </select>

                                </div>

                            </div>

                        </div>

                    </div>

                    <!-- =====================================================
                         SAUVEGARDE
                    ====================================================== -->
                    <div
                        class="settings-section"
                        id="backup-settings"
                    >

                        <div class="settings-section-header">

                            <div>

                                <h3>
                                    Sauvegarde et restauration
                                </h3>

                                <p>
                                    Protégez les informations de l'entreprise et restaurez
                                    les données en cas de besoin.
                                </p>

                            </div>

                            <div class="settings-section-icon">
                                💾
                            </div>

                        </div>

                        <div class="backup-status-card">

                            <div class="backup-status-icon">
                                ✅
                            </div>

                            <div>

                                <h4>
                                    Dernière sauvegarde réussie
                                </h4>

                                <p>
                                    21 juillet 2026 à 02:00
                                </p>

                            </div>

                            <span class="status-badge status-paid">
                                À jour
                            </span>

                        </div>

                        <div class="settings-form-grid">

                            <div class="backup-action-card">

                                <div class="backup-action-icon">
                                    ☁️
                                </div>

                                <h4>
                                    Sauvegarde manuelle
                                </h4>

                                <p>
                                    Créez immédiatement une copie des données du système.
                                </p>

                                <button
                                    type="button"
                                    class="btn-primary"
                                    id="manual-backup-btn"
                                >
                                    Sauvegarder maintenant
                                </button>

                            </div>

                            <div class="backup-action-card">

                                <div class="backup-action-icon">
                                    📥
                                </div>

                                <h4>
                                    Exporter les données
                                </h4>

                                <p>
                                    Téléchargez une copie des données au format Excel.
                                </p>

                                <button
                                    type="button"
                                    class="btn-secondary"
                                    id="export-data-btn"
                                >
                                    Exporter les données
                                </button>

                            </div>

                            <div class="backup-action-card">

                                <div class="backup-action-icon">
                                    🔄
                                </div>

                                <h4>
                                    Restaurer les données
                                </h4>

                                <p>
                                    Importez une sauvegarde précédente du système.
                                </p>

                                <label
                                    for="restore-file-input"
                                    class="btn-secondary"
                                >
                                    Choisir une sauvegarde
                                </label>

                                <input
                                    type="file"
                                    id="restore-file-input"
                                    accept=".xlsx,.csv,.json"
                                    hidden
                                >

                            </div>

                            <div class="backup-action-card danger-card">

                                <div class="backup-action-icon">
                                    ⚠️
                                </div>

                                <h4>
                                    Réinitialiser le système
                                </h4>

                                <p>
                                    Supprimez toutes les données et restaurez les paramètres initiaux.
                                </p>

                                <button
                                    type="button"
                                    class="btn-danger"
                                    id="reset-system-btn"
                                >
                                    Réinitialiser
                                </button>

                            </div>

                        </div>

                        <div class="security-settings-block">

                            <h4>
                                Sauvegarde automatique
                            </h4>

                            <div class="settings-options-list">

                                <label class="settings-switch-row">

                                    <div>

                                        <strong>
                                            Activer les sauvegardes automatiques
                                        </strong>

                                        <span>
                                            Créer automatiquement une copie des données.
                                        </span>

                                    </div>

                                    <input
                                        type="checkbox"
                                        class="settings-switch-input"
                                        checked
                                    >

                                    <span class="settings-switch"></span>

                                </label>

                                <div class="settings-inline-option">

                                    <div>

                                        <strong>
                                            Fréquence de sauvegarde
                                        </strong>

                                        <span>
                                            Choisissez la fréquence de création des sauvegardes.
                                        </span>

                                    </div>

                                    <select id="backup-frequency">

                                        <option value="daily" selected>
                                            Tous les jours
                                        </option>

                                        <option value="weekly">
                                            Toutes les semaines
                                        </option>

                                        <option value="monthly">
                                            Tous les mois
                                        </option>

                                    </select>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>

<script src="../js/visibl-clients-layout.js"></script>


<script src="../js/app.js"></script>
<script src="../js/modules/notifications.js"></script>
<script src="../js/header.js"></script>


<script src="../js/modules/paramètres.js"></script>


<script src="../js/visibl-ui.js" defer></script>
</template>
</body>

</html>
