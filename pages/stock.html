<!DOCTYPE html>
<html lang="fr" data-visibl-session-locked>

<head>
    <script id="visibl-session-early">
        (() => {
            try {
                const session = JSON.parse(localStorage.getItem("visibl_user"));
                if (typeof session?.sessionToken === "string" && session.sessionToken.trim() &&
                    typeof session.roleId === "string" && session.roleId.trim()) return;
            } catch {}
            location.replace("connexion.html");
        })();
    </script>
    <script id="visibl-session-fallback">
        (() => {
            const recuperer = () => {
                if (document.documentElement.hasAttribute("data-visibl-session-started")) return;
                const status = document.getElementById("visibl-session-status");
                if (!status || status.getAttribute("aria-busy") === "false") return;
                document.getElementById("visibl-session-message").textContent = "Vérification indisponible. Réessayez.";
                const retry = document.getElementById("visibl-session-retry");
                retry.hidden = false;
                retry.addEventListener("click", () => location.reload(), { once: true });
                status.setAttribute("aria-busy", "false");
            };
            document.addEventListener("DOMContentLoaded", recuperer, { once: true });
            window.setTimeout(recuperer, 12000);
        })();
    </script>




    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Stock</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/stock.css"
    >

    <link rel="stylesheet" href="../css/visibl-loading.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/visibl-ui.css">
    <link rel="stylesheet" href="../css/visibl-clients-layout.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="../css/visibl-session.css">
    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/visibl-loading.js" defer></script>
    <script src="../js/visibl-session-page.js" defer></script>
</head>

<body>
<section id="visibl-session-status" aria-label="Chargement" aria-busy="true">
    <p id="visibl-session-message" role="status"></p>
    <button type="button" id="visibl-session-retry" hidden>Réessayer</button>
</section>
<template id="visibl-private-content">

<div class="container">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <div data-visibl-sidebar-slot></div>


    <!-- =====================================================
         CONTENU PRINCIPAL
    ====================================================== -->

    <main class="main-content">


        <!-- ===== Header ===== -->
        <div data-visibl-header-slot data-title="Stock" data-search="Rechercher un produit en stock..." data-search-id="header-stock-search-input" data-search-button="header-stock-search-btn"></div>




        <!-- =================================================
             CONTENU DE LA PAGE
        ================================================== -->

        <section class="content">

            <div class="welcome-section">
                <h2>État du stock</h2>
                <p>
                    Consultez en temps réel le stock physique, réservé,
                    non vendable et réellement vendable de chaque produit.
                </p>
            </div>

            <div class="kpi-grid" id="stock-kpi-grid">

                <article class="kpi-card">
                    <div class="kpi-icon" aria-hidden="true">📦</div>
                    <div class="kpi-content">
                        <h3>Stock physique</h3>
                        <p class="kpi-value" id="kpi-stock-physique">0</p>
                        <small>Unités physiquement présentes</small>
                    </div>
                </article>

                <article class="kpi-card">
                    <div class="kpi-icon" aria-hidden="true">🔒</div>
                    <div class="kpi-content">
                        <h3>Stock réservé</h3>
                        <p class="kpi-value" id="kpi-stock-reserve">0</p>
                        <small>Unités réservées aux commandes confirmées</small>
                    </div>
                </article>

                <article class="kpi-card">
                    <div class="kpi-icon" aria-hidden="true">⛔</div>
                    <div class="kpi-content">
                        <h3>Stock non vendable</h3>
                        <p class="kpi-value" id="kpi-stock-non-vendable">0</p>
                        <small>Unités présentes mais interdites à la vente</small>
                    </div>
                </article>

                <article class="kpi-card">
                    <div class="kpi-icon" aria-hidden="true">✅</div>
                    <div class="kpi-content">
                        <h3>Stock vendable</h3>
                        <p class="kpi-value" id="kpi-stock-vendable">0</p>
                        <small>Unités disponibles pour une nouvelle commande</small>
                    </div>
                </article>

            </div>

            <div class="sales-toolbar stock-toolbar">
  <div class="stock-toolbar-left stock-toolbar-summary"><span class="stock-visible-count"><strong id="filtered-stock-count">0</strong> produit(s) affiché(s)</span></div>
  <div class="stock-toolbar-right stock-toolbar-actions">
                    <a href="mouvement_stock.html" class="btn-secondary stock-movements-link" id="view-stock-movements-btn">
                        🔄 <span>Voir les mouvements</span>
                    </a>
    <div class="stock-actions-menu">
      <button class="btn-secondary stock-actions-trigger" id="stock-actions-trigger" type="button" aria-expanded="false" aria-controls="stock-actions-dropdown">Actions <span aria-hidden="true">⌄</span></button>
      <div class="stock-actions-dropdown" id="stock-actions-dropdown" hidden>

        <button type="button" id="refresh-stock-btn">↻ <span>Actualiser</span></button>
        <button type="button" id="export-stock-btn">📤 <span>Exporter</span></button>
        <button type="button" id="print-stock-btn">🖨️ <span>Imprimer</span></button>
      </div>
    </div>
  </div>
</div>
<div class="sales-filters stock-filters">

                <div class="sales-search">
                    <input
                        type="search"
                        id="stock-search-input"
                        placeholder="Rechercher par produit ou référence..."
                        autocomplete="off"
                        aria-label="Rechercher dans le stock"
                    >
                </div>

                <select id="stock-status-filter" aria-label="Filtrer par état du stock">
                    <option value="">Tous les états</option>
                    <option value="normal">Stock normal</option>
                    <option value="faible">Stock faible</option>
                    <option value="rupture">Rupture de stock</option>
                </select>

                <button type="button" class="btn-filter-reset" id="reset-stock-filters">
                    Effacer les filtres
                </button>

            </div>

            <div class="sales-table-container">

                <table class="sales-table stock-table">

                    <thead>
                        <tr>
                            <th>Référence</th>
                            <th>Produit</th>
                            <th>Stock physique</th>
                            <th>Réservé</th>
                            <th>Non vendable</th>
                            <th>Vendable</th>
                            <th>Seuil d’alerte</th>
                            <th>État</th>
                            <th>Dernière opération</th>
                            <th>Dernière mise à jour</th>
                        </tr>
                    </thead>

                    <tbody id="stock-table-body">
                        <tr>
                            <td colspan="10" class="table-message">
                                Chargement du stock...
                            </td>
                        </tr>
                    </tbody>

                </table>

                <div class="stock-pagination">

                    <div class="stock-pagination-size">
                        <label for="stock-page-size">Afficher</label>

                        <select id="stock-page-size">
                            <option value="10" selected>10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>

                        <span>produits par page</span>
                    </div>

                    <div class="stock-pagination-summary" id="stock-pagination-summary">
                        0 produit
                    </div>

                    <div
                        class="stock-pagination-controls"
                        id="stock-pagination-controls"
                        aria-label="Pagination du stock"
                    ></div>

                </div>

            </div>

        </section>

    </main>

</div>

<div id="toast-container"></div>

<script src="../js/visibl-clients-layout.js"></script>


<script src="../js/app.js"></script>
<script src="../js/modules/notifications.js"></script>
<script src="../js/header.js"></script>


<script src="../js/modules/stock.js"></script>

<script src="../js/visibl-ui.js" defer></script>
</template>
</body>
</html>
