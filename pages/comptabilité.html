<!DOCTYPE html>
<html lang="fr" data-visibl-session-locked>
<head>
    <script id="visibl-session-early">
        (() => {
            try {
                const session = JSON.parse(localStorage.getItem("visibl_user"));
                if (typeof session?.sessionToken === "string" && session.sessionToken.trim() &&
                    typeof session.roleId === "string" && session.roleId.trim()) return;
            } catch {}
            location.replace("connexion.html");
        })();
    </script>
    <script id="visibl-session-fallback">
        (() => {
            const recuperer = () => {
                if (document.documentElement.hasAttribute("data-visibl-session-started")) return;
                const status = document.getElementById("visibl-session-status");
                if (!status || status.getAttribute("aria-busy") === "false") return;
                document.getElementById("visibl-session-message").textContent = "Vérification indisponible. Réessayez.";
                const retry = document.getElementById("visibl-session-retry");
                retry.hidden = false;
                retry.addEventListener("click", () => location.reload(), { once: true });
                status.setAttribute("aria-busy", "false");
            };
            document.addEventListener("DOMContentLoaded", recuperer, { once: true });
            window.setTimeout(recuperer, 12000);
        })();
    </script>



    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comptabilité</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/comptabilité.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="../css/visibl-loading.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/visibl-ui.css">
    <link rel="stylesheet" href="../css/visibl-clients-layout.css">

    <link rel="stylesheet" href="../css/visibl-session.css">
    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/visibl-loading.js" defer></script>
    <script src="../js/visibl-session-page.js" defer></script>
</head>
<body>
<section id="visibl-session-status" aria-label="Chargement" aria-busy="true">
    <p id="visibl-session-message" role="status"></p>
    <button type="button" id="visibl-session-retry" hidden>Réessayer</button>
</section>
<template id="visibl-private-content">
<div class="container">

    <div data-visibl-sidebar-slot></div>

    <main class="main-content">
        <div data-visibl-header-slot data-title="Comptabilité" data-search="Rechercher une écriture..."></div>
        <section class="content">

<div class="welcome-section finance-welcome"><div><h2>Comptabilité</h2><p>Consultez les écritures générées automatiquement par les ventes, paiements, mouvements de caisse et pièces justificatives. La saisie manuelle reste exceptionnelle.</p></div></div>
<div class="finance-kpi-grid"><article class="finance-kpi-card"><div class="finance-kpi-head"><span class="finance-kpi-icon">📈</span><span>Produits</span></div><h3 id="accounting-income-value">0 FCFA</h3><p>Total des produits comptabilisés</p></article><article class="finance-kpi-card"><div class="finance-kpi-head"><span class="finance-kpi-icon">📉</span><span>Charges</span></div><h3 id="accounting-expense-value">0 FCFA</h3><p>Total des charges comptabilisées</p></article><article class="finance-kpi-card"><div class="finance-kpi-head"><span class="finance-kpi-icon">💹</span><span>Résultat</span></div><h3 id="accounting-result-value">0 FCFA</h3><p>Produits moins charges</p></article><article class="finance-kpi-card"><div class="finance-kpi-head"><span class="finance-kpi-icon">📚</span><span>Écritures</span></div><h3 id="accounting-entries-value">0 FCFA</h3><p>Nombre d’écritures générées</p></article></div>
<div class="finance-toolbar">
  <div class="toolbar-left"><span><strong id="filtered-accounting-count">0</strong> écriture(s)</span></div>
  <div class="toolbar-right">
    <div class="accounting-actions-menu">
      <button class="btn-secondary accounting-actions-trigger" id="accounting-actions-trigger" type="button" aria-expanded="false">Actions <span>⌄</span></button>
      <div class="accounting-actions-dropdown" id="accounting-actions-dropdown" hidden>
        <button type="button" id="export-accounting-btn">📤 Exporter</button>
        <button type="button" id="print-accounting-btn">🖨️ Imprimer</button>
        <button type="button" id="refresh-accounting-btn">🔄 Actualiser</button>
      </div>
    </div>
  </div>
</div>
<div class="finance-filters">
  <select id="accounting-journal-filter"><option value="">Tous les journaux</option><option value="ventes">Ventes</option><option value="caisse">Caisse</option><option value="banque">Banque</option><option value="achats">Achats</option><option value="operations-diverses">Opérations diverses</option></select>
  <select id="accounting-source-filter"><option value="">Toutes les sources</option><option value="vente">Vente</option><option value="paiement">Paiement</option><option value="caisse">Caisse</option><option value="depense">Dépense</option><option value="approvisionnement">Approvisionnement</option></select>
  <label class="accounting-date-filter"><span>Date</span><input id="accounting-date-from" type="date" aria-label="Date"></label>
  <button class="btn-filter-reset" id="reset-accounting-filters">Effacer</button>
</div>
<div class="finance-table-container"><div class="table-responsive"><table class="finance-table accounting-table">
<thead><tr><th>Date</th><th>Journal</th><th>Référence</th><th>Compte</th><th>Libellé</th><th>Débit</th><th>Crédit</th><th>Source</th><th>Pièce</th><th>Utilisateur</th></tr></thead>
<tbody id="accounting-table-body"><tr><td colspan="10" class="empty-table">Aucune écriture comptable.</td></tr></tbody>
</table></div></div>
<nav class="visibl-pagination" aria-label="Pagination des écritures comptables">
    <button class="btn-secondary" id="accounting-previous-page" type="button" disabled>Précédent</button>
    <span id="accounting-page-status" aria-live="polite">Page 1 sur 1</span>
    <button class="btn-secondary" id="accounting-next-page" type="button" disabled>Suivant</button>
</nav>

        </section>
    </main>
</div>
<div id="toast-container"></div>
<script src="../js/visibl-clients-layout.js"></script>


<script src="../js/app.js"></script>
<script src="../js/modules/notifications.js"></script>
<script src="../js/header.js"></script>


<script src="../js/modules/comptabilité.js"></script>
<script src="../js/visibl-ui.js" defer></script>
</template>
</body>
</html>
