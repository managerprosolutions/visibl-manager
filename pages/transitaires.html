<!DOCTYPE html>
<html lang="fr" data-visibl-session-locked>
<head>
    <script id="visibl-session-early">
        (() => {
            try {
                const session = JSON.parse(localStorage.getItem("visibl_user"));
                if (typeof session?.sessionToken === "string" && session.sessionToken.trim() &&
                    typeof session.roleId === "string" && session.roleId.trim()) return;
            } catch {}
            location.replace("connexion.html");
        })();
    </script>
    <script id="visibl-session-fallback">
        (() => {
            const recuperer = () => {
                if (document.documentElement.hasAttribute("data-visibl-session-started")) return;
                const status = document.getElementById("visibl-session-status");
                if (!status || status.getAttribute("aria-busy") === "false") return;
                document.getElementById("visibl-session-message").textContent = "Vérification indisponible. Réessayez.";
                const retry = document.getElementById("visibl-session-retry");
                retry.hidden = false;
                retry.addEventListener("click", () => location.reload(), { once: true });
                status.setAttribute("aria-busy", "false");
            };
            document.addEventListener("DOMContentLoaded", recuperer, { once: true });
            window.setTimeout(recuperer, 12000);
        })();
    </script>



    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transitaires</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/transitaires.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="../css/visibl-loading.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/visibl-ui.css">
    <link rel="stylesheet" href="../css/visibl-clients-layout.css">

    <link rel="stylesheet" href="../css/visibl-session.css">
    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/visibl-loading.js" defer></script>
    <script src="../js/visibl-session-page.js" defer></script>
</head>
<body>
<section id="visibl-session-status" aria-label="Chargement" aria-busy="true">
    <p id="visibl-session-message" role="status"></p>
    <button type="button" id="visibl-session-retry" hidden>Réessayer</button>
</section>
<template id="visibl-private-content">
<div class="container">
    <div data-visibl-sidebar-slot></div>

    <main class="main-content">
        <div data-visibl-header-slot data-title="Transitaires" data-search="Rechercher un transitaire..." data-search-id="header-transitaires-search-input" data-search-button="header-transitaires-search-btn"></div>

        <section class="content">
            <div class="welcome-section">
                <div>
                    <h2>Gestion des transitaires</h2>
                    <p>Enregistrez, consultez et gérez les transitaires, leurs coordonnées et leurs conditions de transport.</p>
                </div>
                <button class="btn-primary" id="new-transitaire-btn" type="button">➕ Nouveau transitaire</button>
            </div>

            <div class="kpi-grid transitaires-kpi-grid">
                <article class="kpi-card"><div class="kpi-card-header"><span class="kpi-icon">🚢</span><span class="kpi-title">Total transitaires</span></div><h3 class="kpi-value" id="total-transitaires-value">0</h3><p class="kpi-description">Transitaires enregistrés</p></article>
                <article class="kpi-card"><div class="kpi-card-header"><span class="kpi-icon">✅</span><span class="kpi-title">Transitaires actifs</span></div><h3 class="kpi-value" id="active-transitaires-value">0</h3><p class="kpi-description" id="active-transitaires-description">0 % des transitaires</p></article>
                <article class="kpi-card"><div class="kpi-card-header"><span class="kpi-icon">🌍</span><span class="kpi-title">Pays couverts</span></div><h3 class="kpi-value" id="countries-covered-value">0</h3><p class="kpi-description">Pays distincts</p></article>
                <article class="kpi-card"><div class="kpi-card-header"><span class="kpi-icon">🚚</span><span class="kpi-title">Types de transport</span></div><h3 class="kpi-value" id="transport-types-value">0</h3><p class="kpi-description">Modes disponibles</p></article>
            </div>

            <div class="transitaires-toolbar transitaires-toolbar-refined">
                <div class="toolbar-left transitaires-toolbar-summary">
                    <span class="transitaire-count">
                        <strong id="filtered-transitaire-count">0</strong>
                        transitaire(s) affiché(s)
                    </span>
                </div>

                <div class="toolbar-right transitaires-toolbar-actions">

                    <div class="transitaires-actions-menu">
                        <button
                            type="button"
                            class="btn-secondary transitaires-actions-trigger"
                            id="transitaires-actions-trigger"
                            aria-expanded="false"
                            aria-controls="transitaires-actions-dropdown"
                        >
                            Actions <span aria-hidden="true">⌄</span>
                        </button>

                        <div
                            class="transitaires-actions-dropdown"
                            id="transitaires-actions-dropdown"
                            hidden
                        >
                            <button type="button" id="refresh-transitaires-btn">
                                🔄 <span>Actualiser</span>
                            </button>
                            <button type="button" id="export-transitaires-btn">
                                📤 <span>Exporter</span>
                            </button>
                            <button type="button" id="print-transitaires-btn">
                                🖨️ <span>Imprimer</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="transitaires-filters">
                <div class="transitaires-search"><span class="search-icon">🔍</span><input type="search" id="transitaires-search-input" placeholder="Rechercher par nom, contact, téléphone, pays..."></div>
                <select id="transitaire-status-filter"><option value="">Tous les statuts</option><option value="actif">Actif</option><option value="inactif">Inactif</option><option value="suspendu">Suspendu</option><option value="archive">Archivé</option></select>
                <select id="transitaire-transport-filter"><option value="">Tous les transports</option><option value="maritime">Maritime</option><option value="aerien">Aérien</option><option value="routier">Routier</option><option value="multimodal">Multimodal</option></select>
                <select id="transitaire-country-filter"><option value="">Tous les pays</option></select>
                <button class="btn-filter-reset" id="reset-transitaire-filters" type="button">Effacer les filtres</button>
            </div>

            <div class="transitaires-table-container">
                <div class="table-responsive">
                    <table class="transitaires-table">
                        <thead><tr><th>ID Transitaire</th><th>Nom du Transitaire</th><th>Contact</th><th>Téléphone / WhatsApp</th><th>Pays / Ville</th><th>Type de Transport</th><th>Délai Moyen</th><th>Devise</th><th>Statut</th><th>Actions</th></tr></thead>
                        <tbody id="transitaires-table-body"><tr><td colspan="10" class="empty-table">Aucun transitaire enregistré.</td></tr></tbody>
                    </table>
                </div>

                <div class="empty-state" id="transitaires-empty-state" hidden>
                    <div class="empty-state-icon">🚢</div><h3>Aucun transitaire trouvé</h3><p>Aucun transitaire ne correspond à votre recherche ou aux filtres sélectionnés.</p><button class="btn-primary" id="empty-new-transitaire-btn" type="button">Ajouter un transitaire</button>
                </div>

                <div class="table-pagination">
                    <div class="pagination-info"><span>Afficher</span><select id="transitaires-per-page"><option value="10">10</option><option value="25">25</option><option value="50">50</option><option value="100">100</option></select><span>éléments par page</span></div>
                    <div class="pagination-controls"><button type="button" class="pagination-btn" id="previous-transitaire-page-btn" aria-label="Page précédente">‹</button><span id="transitaires-page-buttons" class="pagination-controls"></span><span id="transitaires-pagination-summary" class="pagination-summary"></span><button type="button" class="pagination-btn" id="next-transitaire-page-btn" aria-label="Page suivante">›</button></div>
                </div>
            </div>
        </section>
    </main>
</div>

<div class="modal-overlay" id="transitaire-modal" aria-hidden="true">
    <div class="modal transitaire-modal" role="dialog" aria-modal="true" aria-labelledby="transitaire-modal-title">
        <div class="modal-header"><div><h2 id="transitaire-modal-title">Nouveau transitaire</h2><p>Renseignez les informations du transitaire.</p></div><button type="button" class="modal-close" id="close-transitaire-modal" aria-label="Fermer la fenêtre">✕</button></div>
        <form id="transitaire-form">
            <div class="modal-body">
                <div id="transitaire-form-message" class="form-message" aria-live="polite"></div>
                <input type="hidden" id="transitaire-id" name="idTransitaire">

                <section class="form-section">
                    <div class="form-section-header"><span class="form-section-icon">🏢</span><div><h3>Informations générales</h3><p>Identité, contact principal et statut</p></div></div>
                    <div class="form-grid">
                        <div class="form-group"><label for="transitaire-name">Nom du Transitaire <span class="required">*</span></label><input type="text" id="transitaire-name" name="nomTransitaire" placeholder="Exemple : Global Transit CI" required></div>
                        <div class="form-group"><label for="transitaire-contact-name">Nom du Contact <span class="required">*</span></label><input type="text" id="transitaire-contact-name" name="nomContact" placeholder="Exemple : Koffi Jean" required></div>
                        <div class="form-group"><label for="transitaire-status">Statut <span class="required">*</span></label><select id="transitaire-status" name="statut" required><option value="Actif">Actif</option><option value="Inactif">Inactif</option><option value="Suspendu">Suspendu</option><option value="Archivé">Archivé</option></select></div>
                    </div>
                </section>

                <section class="form-section">
                    <div class="form-section-header"><span class="form-section-icon">📞</span><div><h3>Coordonnées</h3><p>Téléphone, WhatsApp et email</p></div></div>
                    <div class="form-grid">
                        <div class="form-group"><label for="transitaire-phone">Téléphone <span class="required">*</span></label><input type="tel" id="transitaire-phone" name="telephone" placeholder="+225 07 00 00 00 00" required></div>
                        <div class="form-group"><label for="transitaire-whatsapp">WhatsApp</label><input type="tel" id="transitaire-whatsapp" name="whatsapp" placeholder="+225 05 00 00 00 00"></div>
                        <div class="form-group"><label for="transitaire-email">Email</label><input type="email" id="transitaire-email" name="email" placeholder="contact@transitaire.com"></div>
                    </div>
                </section>

                <section class="form-section">
                    <div class="form-section-header"><span class="form-section-icon">📍</span><div><h3>Localisation</h3><p>Pays, ville et adresse complète</p></div></div>
                    <div class="form-grid">
                        <div class="form-group"><label for="transitaire-country">Pays <span class="required">*</span></label><input type="text" id="transitaire-country" name="pays" placeholder="Exemple : Chine" required></div>
                        <div class="form-group"><label for="transitaire-city">Ville <span class="required">*</span></label><input type="text" id="transitaire-city" name="ville" placeholder="Exemple : Guangzhou" required></div>
                        <div class="form-group form-group-full"><label for="transitaire-address">Adresse</label><textarea id="transitaire-address" name="adresse" rows="3" placeholder="Adresse complète du transitaire..."></textarea></div>
                    </div>
                </section>

                <section class="form-section">
                    <div class="form-section-header"><span class="form-section-icon">🚚</span><div><h3>Conditions de transport</h3><p>Transport, délai moyen et devise</p></div></div>
                    <div class="form-grid">
                        <div class="form-group"><label for="transitaire-transport-type">Type de Transport <span class="required">*</span></label><select id="transitaire-transport-type" name="typeTransport" required><option value="">Sélectionner</option><option value="Maritime">Maritime</option><option value="Aérien">Aérien</option><option value="Routier">Routier</option><option value="Multimodal">Multimodal</option></select></div>
                        <div class="form-group"><label for="transitaire-average-delay">Délai Moyen <span class="required">*</span></label><input type="text" id="transitaire-average-delay" name="delaiMoyen" placeholder="Exemple : 15 jours" required></div>
                        <div class="form-group"><label for="transitaire-currency">Devise <span class="required">*</span></label><select id="transitaire-currency" name="devise" required><option value="">Sélectionner</option><option value="FCFA">FCFA</option><option value="USD">USD</option><option value="EUR">EUR</option><option value="GBP">GBP</option><option value="CNY">CNY</option></select></div>
                    </div>
                </section>

                <section class="form-section">
                    <div class="form-section-header"><span class="form-section-icon">📝</span><div><h3>Commentaire</h3><p>Informations complémentaires</p></div></div>
                    <div class="form-group"><label for="transitaire-comment">Commentaire</label><textarea id="transitaire-comment" name="commentaire" rows="4" placeholder="Ajoutez une information utile..."></textarea></div>
                </section>
            </div>

            <div class="modal-footer"><button type="button" class="btn-secondary" id="cancel-transitaire-btn">Annuler</button><button type="submit" class="btn-primary" id="save-transitaire-btn">Enregistrer le transitaire</button></div>
        </form>
    </div>
</div>

<div class="modal-overlay" id="view-transitaire-modal" aria-hidden="true">
    <div class="modal view-transitaire-modal" role="dialog" aria-modal="true" aria-labelledby="view-transitaire-modal-title">
        <div class="view-transitaire-hero">
            <button type="button" class="modal-close view-transitaire-close" id="close-view-transitaire-modal" aria-label="Fermer la fenêtre">✕</button>
            <div class="view-transitaire-profile">
                <div class="view-transitaire-avatar" id="view-transitaire-avatar" aria-hidden="true">TR</div>
                <div class="view-transitaire-profile-main">
                    <div class="view-transitaire-title-row"><div><p class="view-transitaire-eyebrow">Fiche transitaire</p><h2 id="view-transitaire-modal-title"><span id="view-transitaire-name">—</span></h2></div><span class="view-transitaire-status status-inconnu" id="view-transitaire-status">—</span></div>
                    <div class="view-transitaire-meta"><span><i class="fa-solid fa-fingerprint"></i><strong id="view-transitaire-id">—</strong></span><span><i class="fa-solid fa-truck-fast"></i><strong id="view-transitaire-transport">—</strong></span><span><i class="fa-solid fa-money-bill-wave"></i><strong id="view-transitaire-currency">—</strong></span></div>
                </div>
            </div>
        </div>

        <div class="modal-body view-transitaire-body">
            <section class="view-transitaire-card view-transitaire-analysis-card">
                <div class="view-transitaire-card-header">
                    <div class="view-transitaire-card-icon"><i class="fa-solid fa-chart-line"></i></div>
                    <div>
                        <h3>Analyse transitaire</h3>
                        <p>Performance calculée à partir des approvisionnements réellement liés à ce transitaire</p>
                    </div>
                </div>

                <div class="view-transitaire-analysis-grid">
                    <div class="view-transitaire-analysis-kpi">
                        <span>Approvisionnements gérés</span>
                        <strong id="view-transitaire-analysis-count">0</strong>
                    </div>
                    <div class="view-transitaire-analysis-kpi">
                        <span>Valeur transportée</span>
                        <strong id="view-transitaire-analysis-amount">0</strong>
                    </div>
                    <div class="view-transitaire-analysis-kpi">
                        <span>Dernier approvisionnement</span>
                        <strong id="view-transitaire-analysis-last">—</strong>
                    </div>
                    <div class="view-transitaire-analysis-kpi">
                        <span>Délai moyen réel</span>
                        <strong id="view-transitaire-analysis-delay">—</strong>
                    </div>
                </div>

                <div class="view-transitaire-performance">
                    <span>Performance délai</span>
                    <strong id="view-transitaire-analysis-performance" class="transitaire-performance-badge performance-neutral">Pas assez de données</strong>
                </div>
            </section>

            <section class="view-transitaire-card view-transitaire-history-card">
                <div class="view-transitaire-card-header">
                    <div class="view-transitaire-card-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
                    <div>
                        <h3>Historique des approvisionnements</h3>
                        <p>Approvisionnements associés à ce transitaire</p>
                    </div>
                </div>

                <div id="view-transitaire-history-state" class="view-transitaire-history-state">
                    Chargement de l'historique...
                </div>

                <div class="view-transitaire-history-table-wrap">
                    <table class="view-transitaire-history-table">
                        <thead>
                            <tr>
                                <th>Approvisionnement</th>
                                <th>Fournisseur</th>
                                <th>Date d'achat</th>
                                <th>Réception prévue</th>
                                <th>Réception réelle</th>
                                <th>Statut</th>
                                <th>Montant global</th>
                            </tr>
                        </thead>
                        <tbody id="view-transitaire-history-body"></tbody>
                    </table>
                </div>
            </section>

            <section class="view-transitaire-card">
                <div class="view-transitaire-card-header"><div class="view-transitaire-card-icon"><i class="fa-solid fa-ship"></i></div><div><h3>Conditions de transport</h3><p>Délai moyen, devise et type de transport</p></div></div>
                <div class="view-transitaire-info-list horizontal">
                    <div class="view-transitaire-info-item"><span class="view-transitaire-info-icon"><i class="fa-solid fa-truck-fast"></i></span><div><span>Type de Transport</span><strong id="view-transitaire-transport-type">—</strong></div></div>
                    <div class="view-transitaire-info-item"><span class="view-transitaire-info-icon"><i class="fa-solid fa-clock"></i></span><div><span>Délai Moyen</span><strong id="view-transitaire-average-delay">—</strong></div></div>
                    <div class="view-transitaire-info-item"><span class="view-transitaire-info-icon"><i class="fa-solid fa-coins"></i></span><div><span>Devise</span><strong id="view-transitaire-currency-detail">—</strong></div></div>
                </div>
            </section>

            <div class="view-transitaire-content-grid">
                <section class="view-transitaire-card">
                    <div class="view-transitaire-card-header"><div class="view-transitaire-card-icon"><i class="fa-solid fa-location-dot"></i></div><div><h3>Localisation</h3><p>Pays, ville et adresse</p></div></div>
                    <div class="view-transitaire-info-list">
                        <div class="view-transitaire-info-item"><span class="view-transitaire-info-icon"><i class="fa-solid fa-earth-africa"></i></span><div><span>Pays</span><strong id="view-transitaire-country">—</strong></div></div>
                        <div class="view-transitaire-info-item"><span class="view-transitaire-info-icon"><i class="fa-solid fa-city"></i></span><div><span>Ville</span><strong id="view-transitaire-city">—</strong></div></div>
                        <div class="view-transitaire-info-item"><span class="view-transitaire-info-icon"><i class="fa-solid fa-map-pin"></i></span><div><span>Adresse</span><strong id="view-transitaire-address">—</strong></div></div>
                    </div>
                </section>

                <section class="view-transitaire-card">
                    <div class="view-transitaire-card-header"><div class="view-transitaire-card-icon"><i class="fa-solid fa-address-book"></i></div><div><h3>Coordonnées</h3><p>Contact principal et moyens de communication</p></div></div>
                    <div class="view-transitaire-info-list">
                        <div class="view-transitaire-info-item"><span class="view-transitaire-info-icon"><i class="fa-solid fa-user"></i></span><div><span>Nom du Contact</span><strong id="view-transitaire-contact-name">—</strong></div></div>
                        <div class="view-transitaire-info-item"><span class="view-transitaire-info-icon"><i class="fa-solid fa-phone"></i></span><div><span>Téléphone</span><strong id="view-transitaire-phone">—</strong></div></div>
                        <div class="view-transitaire-info-item"><span class="view-transitaire-info-icon"><i class="fa-brands fa-whatsapp"></i></span><div><span>WhatsApp</span><strong id="view-transitaire-whatsapp">—</strong></div></div>
                        <div class="view-transitaire-info-item"><span class="view-transitaire-info-icon"><i class="fa-solid fa-envelope"></i></span><div><span>Email</span><strong id="view-transitaire-email">—</strong></div></div>
                    </div>
                </section>
            </div>

            <section class="view-transitaire-note"><div class="view-transitaire-note-header"><span><i class="fa-solid fa-note-sticky"></i></span><div><h3>Commentaire</h3><p>Notes et informations complémentaires</p></div></div><p id="view-transitaire-comment">—</p></section>
        </div>

        <div class="modal-footer view-transitaire-footer"><span class="view-transitaire-footer-hint"><i class="fa-solid fa-circle-info"></i>Les informations affichées proviennent de la fiche transitaire.</span><button type="button" class="btn-primary" id="close-view-transitaire-footer"><i class="fa-solid fa-check"></i> Fermer</button></div>
    </div>
</div>

<div class="modal-overlay" id="delete-transitaire-modal" aria-hidden="true">
    <div class="modal delete-transitaire-modal" role="dialog" aria-modal="true" aria-labelledby="delete-transitaire-title">
        <div class="delete-transitaire-top"><div class="delete-transitaire-circle"><i class="fa-solid fa-trash-can"></i></div><h2 id="delete-transitaire-title">Supprimer ce transitaire ?</h2><p>Vous êtes sur le point de supprimer définitivement <strong id="delete-transitaire-name">ce transitaire</strong>.</p></div>
        <div class="delete-warning"><i class="fa-solid fa-circle-exclamation"></i><span>Cette opération est irréversible. Toutes les informations du transitaire seront supprimées.</span></div>
        <div class="modal-footer delete-footer"><button type="button" class="btn-secondary" id="cancel-delete-transitaire-btn">Annuler</button><button type="button" class="btn-danger" id="confirm-delete-transitaire-btn"><i class="fa-solid fa-trash"></i> Supprimer définitivement</button></div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="../js/visibl-clients-layout.js"></script>


<script src="../js/app.js"></script>
<script src="../js/modules/notifications.js"></script>
<script src="../js/header.js"></script>


<script src="../js/modules/transitaires.js"></script>
<script src="../js/visibl-ui.js" defer></script>
</template>
</body>
</html>
