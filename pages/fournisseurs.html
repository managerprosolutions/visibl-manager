    <script id="visibl-session-early">
        (() => {
            try {
                const session = JSON.parse(localStorage.getItem("visibl_user"));
                if (typeof session?.sessionToken === "string" && session.sessionToken.trim() &&
                    typeof session.roleId === "string" && session.roleId.trim()) return;
            } catch {}
            location.replace("connexion.html");
        })();
    </script>
    <script id="visibl-session-fallback">
        (() => {
            const recuperer = () => {
                if (document.documentElement.hasAttribute("data-visibl-session-started")) return;
                const status = document.getElementById("visibl-session-status");
                if (!status || status.getAttribute("aria-busy") === "false") return;
                document.getElementById("visibl-session-message").textContent = "Vérification indisponible. Réessayez.";
                const retry = document.getElementById("visibl-session-retry");
                retry.hidden = false;
                retry.addEventListener("click", () => location.reload(), { once: true });
                status.setAttribute("aria-busy", "false");
            };
            document.addEventListener("DOMContentLoaded", recuperer, { once: true });
            window.setTimeout(recuperer, 12000);
        })();
    </script>

                            <label for="supplier-city">Ville</label>

                            <label for="supplier-address">Adresse</label>

                <section class="form-section">

                                name="categorieProduits"

                        <div class="form-group">
                            <label for="supplier-currency">Devise</label>
                            <select id="supplier-currency" name="devise">
                                <option value="">Sélectionner une devise</option>
                                <option value="FCFA">FCFA</option>
                                <option value="EUR">EUR</option>
                                <option value="USD">USD</option>
                                <option value="CNY">CNY</option>
                                <option value="GBP">GBP</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="supplier-payment-terms">Conditions de Paiement</label>
                            <input
                                type="text"
                                id="supplier-payment-terms"
                                name="conditionsPaiement"
                                placeholder="Comptant, acompte..."
                            >
                        </div>

                        <div class="form-group">
                            <label for="supplier-delivery-time">Délai Moyen de Livraison</label>
                            <input
                                type="number"
                                id="supplier-delivery-time"
                                name="delaiMoyenLivraison"
                                min="0"
                                step="1"
                                placeholder="Nombre de jours"
                            >
                        </div>

                        <div class="form-group">
                            <label for="supplier-warranty">Garantie Fournisseur</label>
                            <input
                                type="text"
                                id="supplier-warranty"
                                name="garantieFournisseur"
                                placeholder="Exemple : 12 mois"
                            >
                        </div>
                    </div>
                </section>

                <section class="form-section">
                    <h3>Statut et commentaire</h3>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="supplier-status">

                            </label>

                                <option value="Actif" selected>Actif</option>
                                <option value="Inactif">Inactif</option>
                                <option value="Suspendu">Suspendu</option>
                            </select>
                        </div>

                        <div class="form-group form-group-full">
                            <label for="supplier-comment">Commentaire</label>
                            <textarea
                                id="supplier-comment"
                                name="commentaire"
                                rows="4"
                                placeholder="Informations complémentaires"
                            ></textarea>
                        </div>
                    </div>
                </section>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancel-supplier-btn">
                    Annuler
                </button>

                <button type="submit" class="btn-primary" id="save-supplier-btn">
